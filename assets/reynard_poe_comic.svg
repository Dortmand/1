<?xml version="1.0" encoding="UTF-8"?>
<!--
  Simple original comic-style SVG (vertical 9:16).
  Author: generated by Cursor agent for the repo.
  Usage: can be used directly on web, or converted to PNG via inkscape.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .ink { stroke: #111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .thin { stroke-width: 4; }
      .panel { fill: #fff; stroke: #111; stroke-width: 10; }
      .caption { fill: #111; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 44px; font-weight: 700; }
      .text { fill: #111; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 38px; font-weight: 600; }
      .small { font-size: 34px; font-weight: 600; }
      .bubble { fill: #fff; stroke: #111; stroke-width: 8; }
      .shade { fill: #f2f2f2; stroke: #111; stroke-width: 6; }
      .phone { fill: #fff; stroke: #111; stroke-width: 10; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="1920"/>

  <!-- Layout: four stacked panels -->
  <rect class="panel" x="40" y="40" width="1000" height="440" rx="28"/>
  <rect class="panel" x="40" y="520" width="1000" height="440" rx="28"/>
  <rect class="panel" x="40" y="1000" width="1000" height="440" rx="28"/>
  <rect class="panel" x="40" y="1480" width="1000" height="440" rx="28"/>

  <!-- PANEL 1: Intro / world heavy -->
  <text class="caption" x="80" y="110">&#1055;&#1040;&#1053;&#1045;&#1051;&#1068; 1</text>
  <text class="text" x="80" y="165">&#171;&#1046;&#1080;&#1090;&#1080; &#1074;&#1072;&#1078;&#1082;&#1086;&#8230;&#187;</text>
  <!-- City + rain -->
