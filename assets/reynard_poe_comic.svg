  <text class="text" x="110" y="1685">&#1052;&#1086;&#1108; &#1089;&#1087;&#1088;&#1072;&#1074;&#1078;&#1085;&#1108; &#1110;&#1084;&#8217;&#1103; &#1085;&#1077;&#1074;&#1072;&#1078;&#1083;&#1080;&#1074;&#1077;.</text>
  <text class="text" x="110" y="1740">&#1071; &#1074;&#1080;&#1088;&#1110;&#1096;&#1080;&#1074; &#1079;&#1072;&#1074;&#1077;&#1089;&#1090;&#1080; TikTok-&#1073;&#1083;&#1086;&#1075;</text>
  <text class="text" x="110" y="1795">&#1087;&#1088;&#1086; &#1089;&#1077;&#1073;&#1077; &#1110; &#1089;&#1074;&#1086;&#1108; &#1078;&#1080;&#1090;&#1090;&#1103;.</text>

  <!-- Footer note -->
  <text class="small" x="80" y="1905">&#1030;&#1089;&#1090;&#1086;&#1088;&#1110;&#1103; &#1085;&#1077; &#1074;&#1080;&#1075;&#1072;&#1076;&#1082;&#1072; &#8212; &#1094;&#1077; &#1084;&#1086;&#1108; &#1078;&#1080;&#1090;&#1090;&#1103; &#1079;&#1072;&#1088;&#1072;&#1079;.</text>
