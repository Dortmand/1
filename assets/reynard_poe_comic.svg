  <rect class="shade" x="210" y="240" width="170" height="200" rx="12"/>
  <rect class="shade" x="410" y="210" width="210" height="230" rx="12"/>
  <rect class="shade" x="660" y="260" width="160" height="180" rx="12"/>
  <path class="ink thin" d="M230 280 v40 M270 280 v40 M310 280 v40 M350 280 v40"/>
  <path class="ink thin" d="M430 250 v50 M480 250 v50 M530 250 v50 M580 250 v50"/>
  <path class="ink thin" d="M680 300 v40 M720 300 v40 M760 300 v40"/>
