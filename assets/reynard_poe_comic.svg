  <text class="small" x="590" y="1320">&#1089;&#1072;&#1084; &#1085;&#1077; &#1074;&#1087;&#1086;&#1088;&#1072;&#1102;&#1089;&#1103; &#1079; &#1089;&#1086;&#1073;&#1086;&#1102;.</text>

